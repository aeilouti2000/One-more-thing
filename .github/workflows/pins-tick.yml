# Adds due pinned items (and sends their "back on the list" notifications)
# even while the free Render server is asleep. The request wakes the server.
#
# Setup (once), in GitHub → Settings → Secrets and variables → Actions:
#   API_BASE_URL  e.g. https://one-more-thing-api.onrender.com
#   CRON_SECRET   same value as CRON_SECRET on the Render service
name: Pins tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pins-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due pins
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::API_BASE_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          # A sleeping free server can take up to a minute to wake.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "x-cron-secret: $CRON_SECRET" \
            "${API_BASE_URL%/}/api/internal/pins/run"
