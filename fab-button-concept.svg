<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#2494e6"/><stop offset="1" stop-color="#176ab0"/></linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
    <style>.h{font:700 35px system-ui,sans-serif;fill:#f7f9fc}.t{font:400 18px system-ui,sans-serif;fill:#9bb0c1}.l{font:650 17px system-ui,sans-serif;fill:#f4f8fb}.s{font:500 15px system-ui,sans-serif;fill:#b1c5d5}.b{font:600 15px system-ui,sans-serif;fill:#fff}.hint{font:500 14px system-ui,sans-serif;fill:#8da4b6}</style>
  </defs>
  <rect width="1600" height="1080" fill="#080d11"/>
  <text x="80" y="78" class="h">Floating actions for the shopping list</text>
  <text x="80" y="112" class="t">The input keeps its fast inline add. Extra actions live behind an expandable FAB so the list stays quiet.</text>

  <!-- collapsed -->
  <g transform="translate(150 178)">
    <text x="0" y="-28" class="l">Collapsed — everyday state</text>
    <rect width="490" height="750" rx="38" fill="#0b1015" stroke="#2b3a45" stroke-width="2"/>
    <rect x="0" y="0" width="490" height="104" rx="38" fill="#10161c"/>
    <text x="31" y="46" class="l" font-size="20">My Home</text><text x="31" y="72" class="hint">0 still to get · List</text>
    <text x="420" y="57" class="s">List⌄</text>
    <rect x="24" y="128" width="442" height="70" rx="16" fill="#111921" stroke="#324451" stroke-width="1.5"/>
    <text x="46" y="170" class="hint">Add an item…</text>
    <circle cx="428" cy="163" r="22" fill="url(#blue)"/>
    <text x="420" y="171" class="b" font-size="24">＋</text>
    <text x="24" y="239" class="s">All items⌄</text>
    <line x1="24" y1="258" x2="466" y2="258" stroke="#24323c"/>
    <rect x="24" y="280" width="442" height="110" rx="18" fill="#10161c" stroke="#1c2933" stroke-dasharray="4 4"/>
    <text x="155" y="326" class="l">Nothing to buy</text><text x="84" y="355" class="hint">Add the first item so you and your partner stay in sync.</text>
    <!-- FAB -->
    <g filter="url(#shadow)">
      <circle cx="406" cy="568" r="22" fill="#192a38" stroke="#3c5870" stroke-width="1.5"/>
      <text x="397" y="575" class="b" fill="#89c9fa" font-size="22">⌃</text>
      <circle cx="406" cy="640" r="36" fill="url(#blue)"/>
      <text x="390" y="650" class="b" font-size="34">＋</text>
      <rect x="284" y="616" width="99" height="48" rx="24" fill="#123f63"/>
      <text x="308" y="646" class="b">Add</text>
    </g>
    <text x="32" y="704" class="hint">Tap the small arrow for secondary actions</text>
  </g>

  <!-- expanded -->
  <g transform="translate(960 178)">
    <text x="0" y="-28" class="l">Expanded — intentional secondary actions</text>
    <rect width="490" height="750" rx="38" fill="#0b1015" stroke="#2b3a45" stroke-width="2"/>
    <rect x="0" y="0" width="490" height="104" rx="38" fill="#10161c"/>
    <text x="31" y="46" class="l" font-size="20">My Home</text><text x="31" y="72" class="hint">0 still to get · List</text>
    <text x="420" y="57" class="s">List⌄</text>
    <rect x="24" y="128" width="442" height="70" rx="16" fill="#111921" stroke="#324451" stroke-width="1.5"/>
    <text x="46" y="170" class="hint">Add an item…</text>
    <circle cx="428" cy="163" r="22" fill="url(#blue)"/><text x="420" y="171" class="b" font-size="24">＋</text>
    <text x="24" y="239" class="s">All items⌄</text><line x1="24" y1="258" x2="466" y2="258" stroke="#24323c"/>
    <rect x="24" y="280" width="442" height="110" rx="18" fill="#10161c" stroke="#1c2933" stroke-dasharray="4 4"/>
    <text x="155" y="326" class="l">Nothing to buy</text><text x="84" y="355" class="hint">Add the first item so you and your partner stay in sync.</text>
    <!-- menu scrim and FABs -->
    <rect x="280" y="406" width="166" height="258" rx="30" fill="#111b23" stroke="#2f4659" stroke-width="1.5"/>
    <g filter="url(#shadow)">
      <rect x="158" y="431" width="194" height="49" rx="24" fill="#1a2731"/><text x="196" y="462" class="s">Shopping</text>
      <circle cx="382" cy="455" r="28" fill="#203442"/><path d="M372 449h20l-2 13h-16zM377 449c0-8 10-8 10 0" fill="none" stroke="#9ed3f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="177" y="502" width="175" height="49" rx="24" fill="#1a2731"/><text x="213" y="533" class="s">Pinned</text>
      <circle cx="382" cy="526" r="28" fill="#203442"/><path d="M382 513v17m-7-12h14l-3 5v6h-8v-6z" fill="none" stroke="#9ed3f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="406" cy="568" r="22" fill="#1b5e91" stroke="#5aaee5" stroke-width="1.5"/><text x="397" y="575" class="b" font-size="22">⌄</text>
      <circle cx="406" cy="640" r="36" fill="url(#blue)"/><text x="390" y="650" class="b" font-size="34">＋</text>
      <rect x="284" y="616" width="99" height="48" rx="24" fill="#123f63"/><text x="308" y="646" class="b">Add</text>
    </g>
    <text x="32" y="704" class="hint">Arrow flips down; tap it or outside the menu to close.</text>
  </g>

  <g transform="translate(150 973)">
    <rect width="1300" height="1" fill="#24343f"/>
    <text x="0" y="45" class="s">Interaction: the inline + adds the typed item immediately. The floating + opens the “Add item” composer (or focuses it), while the arrow expands Pin and Shopping.</text>
  </g>
</svg>
