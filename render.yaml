services:
  - type: web
    name: one-more-thing-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "90"
      - key: CORS_ORIGINS
        value: ""
      - key: APP_MIN_VERSION
        value: "2.5.0"
      - key: APP_LATEST_VERSION
        value: "2.5.0"
      - key: APP_DOWNLOAD_URL
        value: "https://expo.dev/artifacts/eas/pt6vC8hKM88g5i5rPFx3B19Fc0_hFnLZISV4yCZs8uM.apk"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: One More Thing
      # Copy this value into the GitHub Actions secret CRON_SECRET (pins-tick workflow).
      - key: CRON_SECRET
        generateValue: true
      - key: EXPO_ACCESS_TOKEN
        sync: false
