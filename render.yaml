services:
  - type: web
    name: one-more-thing-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "90"
      - key: CORS_ORIGINS
        value: ""
      - key: APP_MIN_VERSION
        value: "2.2.2"
      - key: APP_LATEST_VERSION
        value: ""
      - key: APP_DOWNLOAD_URL
        value: "https://expo.dev/artifacts/eas/k0d7dzQXSlyOAW6e2-kag20k03_xROX5mu-6wamajKY.apk"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: One More Thing
