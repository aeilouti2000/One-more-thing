<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1240" viewBox="0 0 1680 1240">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3d9bf0"/><stop offset="1" stop-color="#2479cf"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="-6" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <path id="pin" d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z"/>
    <style>
      text{font-family:system-ui,"Segoe UI",sans-serif}
      .H{font-size:34px;font-weight:700;fill:#f3f7fb}
      .T{font-size:17px;fill:#93a6b8}
      .L{font-size:21px;font-weight:700;fill:#e8eef4}
      .N{font-size:14px;fill:#9fb1c2}
      .t1{font-size:20px;font-weight:700;fill:#f2f6fa}
      .t2{font-size:13px;fill:#8ea2b4}
      .lab{font-size:12px;font-weight:600;fill:#8ea2b4}
      .val{font-size:15px;fill:#e6edf3}
      .ph{font-size:15px;fill:#5d6f80}
      .chip{font-size:13px;font-weight:600;fill:#dfe7ee}
      .chipOn{font-size:13px;font-weight:700;fill:#ffffff}
      .btn{font-size:16px;font-weight:700;fill:#ffffff}
      .big{font-size:26px;font-weight:700;fill:#f2f6fa}
    </style>

    <!-- dimmed screen behind sheet -->
    <g id="phone">
      <rect width="460" height="960" rx="34" fill="#0a0f15" stroke="#2a333d" stroke-width="2"/>
      <rect x="20" y="40" width="300" height="20" rx="6" fill="#16202a"/>
      <rect x="20" y="90" width="420" height="52" rx="26" fill="#121b25"/>
      <rect x="20" y="160" width="420" height="50" rx="20" fill="#111820"/>
      <rect x="20" y="220" width="420" height="50" rx="20" fill="#111820"/>
      <rect width="460" height="960" rx="34" fill="#000" opacity=".55"/>
    </g>
    <g id="grab"><rect x="208" y="0" width="44" height="5" rx="2.5" fill="#5b6b7a"/></g>
  </defs>

  <rect width="1680" height="1240" fill="#070b10"/>
  <text x="60" y="64" class="H">Item sheet — three directions</text>
  <text x="60" y="96" class="T">Same fields as today (name, quantity, category, urgent, notes), fewer boxes, clearer hierarchy, one obvious action.</text>

  <!-- ===================================================== A -->
  <text x="60" y="150" class="L">A · Focus-first (recommended)</text>
  <text x="60" y="172" class="N">Big name line, stepper, category chips, one dynamic button.</text>
  <g transform="translate(60 190)">
    <use href="#phone"/>
    <g transform="translate(0 300)" filter="url(#sh)">
      <path d="M0 28 a28 28 0 0 1 28 -28 h404 a28 28 0 0 1 28 28 v632 h-460z" fill="#151c24" stroke="#26313c"/>
    </g>
    <g transform="translate(0 312)"><use href="#grab"/></g>
    <!-- header -->
    <text x="28" y="364" class="t1">Add item</text>
    <circle cx="420" cy="357" r="16" fill="#1d2731"/><path d="M414 351l12 12M426 351l-12 12" stroke="#9fb1c2" stroke-width="2" stroke-linecap="round"/>
    <!-- big name -->
    <text x="28" y="420" class="big">Milk</text>
    <rect x="80" y="400" width="2" height="26" fill="#4aa3ff"/>
    <line x1="28" y1="438" x2="432" y2="438" stroke="#4aa3ff" stroke-width="2"/>
    <!-- suggestion chips -->
    <rect x="28" y="452" width="96" height="28" rx="14" fill="#1b2631"/><text x="44" y="471" class="chip" font-size="12">Milk 1L</text>
    <rect x="132" y="452" width="118" height="28" rx="14" fill="#1b2631"/><text x="148" y="471" class="chip" font-size="12">Milk powder</text>
    <!-- quantity stepper row -->
    <text x="28" y="516" class="lab">Quantity</text>
    <rect x="28" y="526" width="150" height="46" rx="23" fill="#1b2631"/>
    <circle cx="51" cy="549" r="17" fill="#243241"/><path d="M44 549h14" stroke="#dfe7ee" stroke-width="2.2" stroke-linecap="round"/>
    <text x="103" y="555" class="val" font-weight="700" text-anchor="middle" font-size="17">2</text>
    <circle cx="155" cy="549" r="17" fill="#2e8ae6"/><path d="M148 549h14M155 542v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- urgent chip -->
    <rect x="196" y="526" width="112" height="46" rx="23" fill="#2a1d1f" stroke="#e0646c"/>
    <path d="M220 538l-7 13h7l-3 11 11-15h-7l3-9z" fill="#f07178"/>
    <text x="236" y="555" class="chip" fill="#f4a3a8">Urgent</text>
    <!-- category chips -->
    <text x="28" y="610" class="lab">Category</text>
    <rect x="28" y="620" width="108" height="38" rx="19" fill="#2e8ae6"/><circle cx="48" cy="639" r="6" fill="#fff"/><text x="60" y="644" class="chipOn">Dairy</text>
    <rect x="144" y="620" width="118" height="38" rx="19" fill="#1b2631"/><circle cx="164" cy="639" r="6" fill="#58c27d"/><text x="176" y="644" class="chip">Produce</text>
    <rect x="270" y="620" width="96" height="38" rx="19" fill="#1b2631"/><circle cx="290" cy="639" r="6" fill="#e48b5a"/><text x="302" y="644" class="chip">Meat</text>
    <rect x="374" y="620" width="70" height="38" rx="19" fill="#1b2631"/><text x="390" y="644" class="chip">More</text>
    <!-- notes collapsed -->
    <path d="M30 694h10M35 689v10" stroke="#4aa3ff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="699" class="chip" fill="#4aa3ff">Add a note (brand, size, store)</text>
    <!-- primary -->
    <rect x="28" y="760" width="404" height="56" rx="18" fill="url(#btn)"/>
    <text x="230" y="794" class="btn" text-anchor="middle">Add 2 × Milk</text>
    <text x="230" y="846" class="t2" text-anchor="middle">Swipe down or tap ✕ to cancel</text>
  </g>

  <!-- ===================================================== B -->
  <text x="600" y="150" class="L">B · Grouped rows</text>
  <text x="600" y="172" class="N">iOS-settings style: one card, label left, value right.</text>
  <g transform="translate(600 190)">
    <use href="#phone"/>
    <g transform="translate(0 300)" filter="url(#sh)">
      <path d="M0 28 a28 28 0 0 1 28 -28 h404 a28 28 0 0 1 28 28 v632 h-460z" fill="#151c24" stroke="#26313c"/>
    </g>
    <g transform="translate(0 312)"><use href="#grab"/></g>
    <!-- header with cancel / title / save -->
    <text x="28" y="362" class="chip" fill="#4aa3ff" font-size="15">Cancel</text>
    <text x="230" y="362" class="t1" text-anchor="middle" font-size="17">New item</text>
    <text x="432" y="362" class="chip" fill="#4aa3ff" font-size="15" font-weight="700" text-anchor="end">Save</text>
    <!-- name card -->
    <rect x="20" y="392" width="420" height="58" rx="18" fill="#1b2631"/>
    <text x="40" y="427" class="val" font-size="17">Milk</text>
    <circle cx="414" cy="421" r="9" fill="#3a4856"/><path d="M410 417l8 8M418 417l-8 8" stroke="#1b2631" stroke-width="2"/>
    <!-- grouped card -->
    <rect x="20" y="466" width="420" height="232" rx="18" fill="#1b2631"/>
    <text x="40" y="503" class="val">Quantity</text>
    <rect x="320" y="484" width="100" height="32" rx="16" fill="#243241"/><path d="M336 500h10" stroke="#dfe7ee" stroke-width="2"/><text x="370" y="506" class="val" font-weight="700" text-anchor="middle">2</text><path d="M394 500h10M399 495v10" stroke="#dfe7ee" stroke-width="2"/>
    <line x1="40" y1="524" x2="440" y2="524" stroke="#26323e"/>
    <text x="40" y="561" class="val">Category</text>
    <circle cx="336" cy="556" r="6" fill="#4aa3ff"/><text x="348" y="561" class="val" fill="#9fb1c2">Dairy</text><path d="M412 550l6 6-6 6" stroke="#6f8397" stroke-width="2" fill="none"/>
    <line x1="40" y1="582" x2="440" y2="582" stroke="#26323e"/>
    <text x="40" y="619" class="val">Urgent</text>
    <rect x="372" y="602" width="48" height="28" rx="14" fill="#e0646c"/><circle cx="406" cy="616" r="11" fill="#fff"/>
    <line x1="40" y1="640" x2="440" y2="640" stroke="#26323e"/>
    <text x="40" y="677" class="val">Note</text>
    <text x="412" y="677" class="ph" text-anchor="end" font-size="14">Optional</text>
    <!-- pin variant row -->
    <rect x="20" y="714" width="420" height="58" rx="18" fill="#1b2631"/>
    <use href="#pin" transform="translate(38 731) scale(.9)" fill="#4aa3ff"/>
    <text x="66" y="749" class="val">Repeat</text>
    <text x="412" y="749" class="val" fill="#9fb1c2" text-anchor="end">Every week ›</text>
    <text x="230" y="808" class="t2" text-anchor="middle">Same layout for Pin (adds “Repeat”) and Edit</text>
    <text x="230" y="828" class="t2" text-anchor="middle">(adds a red “Delete item” row at the bottom).</text>
  </g>

  <!-- ===================================================== C -->
  <text x="1140" y="150" class="L">C · Quick-pick</text>
  <text x="1140" y="172" class="N">Tap-only: recent items, quantity chips, stacked buttons.</text>
  <g transform="translate(1140 190)">
    <use href="#phone"/>
    <g transform="translate(0 300)" filter="url(#sh)">
      <path d="M0 28 a28 28 0 0 1 28 -28 h404 a28 28 0 0 1 28 28 v632 h-460z" fill="#151c24" stroke="#26313c"/>
    </g>
    <g transform="translate(0 312)"><use href="#grab"/></g>
    <text x="28" y="364" class="t1">Add item</text>
    <text x="28" y="386" class="t2">Pick from recent or type a new one</text>
    <!-- search field -->
    <rect x="28" y="404" width="404" height="50" rx="16" fill="#1b2631" stroke="#4aa3ff" stroke-width="1.5"/>
    <circle cx="52" cy="428" r="7" fill="none" stroke="#6f8397" stroke-width="2"/><path d="M57 433l5 5" stroke="#6f8397" stroke-width="2"/>
    <text x="72" y="434" class="ph">Item name</text>
    <!-- recent grid -->
    <text x="28" y="486" class="lab">Recent</text>
    <rect x="28" y="496" width="126" height="44" rx="14" fill="#2e8ae6"/><text x="91" y="523" class="chipOn" text-anchor="middle">Milk ✓</text>
    <rect x="167" y="496" width="126" height="44" rx="14" fill="#1b2631"/><text x="230" y="523" class="chip" text-anchor="middle">Bread</text>
    <rect x="306" y="496" width="126" height="44" rx="14" fill="#1b2631"/><text x="369" y="523" class="chip" text-anchor="middle">Eggs</text>
    <rect x="28" y="548" width="126" height="44" rx="14" fill="#1b2631"/><text x="91" y="575" class="chip" text-anchor="middle">Tomatoes</text>
    <rect x="167" y="548" width="126" height="44" rx="14" fill="#1b2631"/><text x="230" y="575" class="chip" text-anchor="middle">Coffee</text>
    <rect x="306" y="548" width="126" height="44" rx="14" fill="#1b2631"/><text x="369" y="575" class="chip" text-anchor="middle">Rice</text>
    <!-- qty chips -->
    <text x="28" y="624" class="lab">How many?</text>
    <rect x="28" y="634" width="60" height="40" rx="20" fill="#1b2631"/><text x="58" y="659" class="chip" text-anchor="middle">1</text>
    <rect x="96" y="634" width="60" height="40" rx="20" fill="#2e8ae6"/><text x="126" y="659" class="chipOn" text-anchor="middle">2</text>
    <rect x="164" y="634" width="60" height="40" rx="20" fill="#1b2631"/><text x="194" y="659" class="chip" text-anchor="middle">3</text>
    <rect x="232" y="634" width="60" height="40" rx="20" fill="#1b2631"/><text x="262" y="659" class="chip" text-anchor="middle">6</text>
    <rect x="300" y="634" width="132" height="40" rx="20" fill="#1b2631"/><text x="366" y="659" class="chip" text-anchor="middle">Other…</text>
    <text x="28" y="706" class="chip" fill="#4aa3ff">Dairy · Not urgent · Add note</text>
    <path d="M232 700l5 5 5-5" stroke="#4aa3ff" stroke-width="2" fill="none" transform="translate(4 0)"/>
    <!-- stacked buttons -->
    <rect x="28" y="736" width="404" height="54" rx="18" fill="url(#btn)"/>
    <text x="230" y="769" class="btn" text-anchor="middle">Add 2 × Milk</text>
    <rect x="28" y="800" width="404" height="54" rx="18" fill="none" stroke="#3a4856" stroke-width="1.5"/>
    <text x="230" y="833" class="chip" font-size="16" text-anchor="middle">Cancel</text>
  </g>

  <!-- ===================================================== notes -->
  <rect x="60" y="1172" width="1560" height="2" fill="#151d26"/>
  <text x="60" y="1206" class="N" font-size="15">What changes vs today: no “ESSENTIALS / EXTRA” headings or accent rule · quantity becomes a − / + stepper · category becomes tappable chips (no dropdown) · urgent becomes a chip/switch with color · notes collapse until needed ·</text>
  <text x="60" y="1228" class="N" font-size="15">the button says what will happen (“Add 2 × Milk”, “Pin Milk weekly”, “Save changes”) and explains why it’s disabled (“Type a name”) instead of just greying out.</text>
</svg>
