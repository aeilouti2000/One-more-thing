<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1290" viewBox="0 0 1840 1290">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3d9bf0"/><stop offset="1" stop-color="#2479cf"/></linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#151c24" stop-opacity="0"/><stop offset="1" stop-color="#151c24"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="-6" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <path id="pin" d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z"/>
    <style>
      text{font-family:system-ui,"Segoe UI",sans-serif}
      .H{font-size:34px;font-weight:700;fill:#f3f7fb}
      .T{font-size:17px;fill:#93a6b8}
      .L{font-size:20px;font-weight:700;fill:#e8eef4}
      .N{font-size:14px;fill:#9fb1c2}
      .t1{font-size:19px;font-weight:700;fill:#f2f6fa}
      .t2{font-size:12px;fill:#8ea2b4}
      .lab{font-size:12px;font-weight:600;fill:#8ea2b4}
      .val{font-size:15px;fill:#e6edf3}
      .chip{font-size:13px;font-weight:600;fill:#dfe7ee}
      .chipOn{font-size:13px;font-weight:700;fill:#ffffff}
      .btn{font-size:16px;font-weight:700;fill:#ffffff}
      .big{font-size:26px;font-weight:700;fill:#f2f6fa}
      .bigph{font-size:26px;font-weight:600;fill:#4b5b6a}
      .key{font-size:15px;fill:#dfe7ee}
    </style>

    <!-- sheet shell 400 x 980 (top part dims the screen) -->
    <g id="shell">
      <rect width="400" height="1000" rx="30" fill="#0a0f15" stroke="#2a333d" stroke-width="2"/>
      <rect x="18" y="38" width="240" height="18" rx="6" fill="#16202a"/>
      <rect x="18" y="80" width="364" height="48" rx="24" fill="#121b25"/>
      <rect width="400" height="1000" rx="30" fill="#000" opacity=".55"/>
    </g>
    <g id="sheetBg">
      <path d="M0 28 a28 28 0 0 1 28 -28 h344 a28 28 0 0 1 28 28 v~ h-400z" fill="none"/>
    </g>
    <g id="close">
      <circle cx="0" cy="0" r="16" fill="#1d2731"/><path d="M-6 -6l12 12M6 -6l-12 12" stroke="#9fb1c2" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="grab"><rect x="178" y="0" width="44" height="5" rx="2.5" fill="#5b6b7a"/></g>

    <!-- category chip row (Supermarket selected) -->
    <g id="cats">
      <rect x="0" y="0" width="124" height="38" rx="19" fill="#2e8ae6"/><circle cx="19" cy="19" r="6" fill="#fff"/><text x="31" y="24" class="chipOn">Supermarket</text>
      <rect x="130" y="0" width="108" height="38" rx="19" fill="#1b2631"/><circle cx="149" cy="19" r="6" fill="#58c27d"/><text x="161" y="24" class="chip">Vegetables</text>
      <rect x="244" y="0" width="72" height="38" rx="19" fill="#1b2631"/><circle cx="262" cy="19" r="6" fill="#e48b5a"/><text x="274" y="24" class="chip">Meat</text>
      <rect x="322" y="0" width="30" height="38" rx="15" fill="#1b2631"/><text x="337" y="24" class="chip" font-size="12" text-anchor="middle">+3</text>
    </g>
  </defs>

  <rect width="1840" height="1290" fill="#070b10"/>
  <text x="60" y="64" class="H">Focus-first item sheet — refined</text>
  <text x="60" y="96" class="T">One sheet for Add, Pin and Edit. Big name, smart defaults, everything one tap away, and a button that says exactly what happens.</text>

  <!-- ========================================================== 1 EMPTY -->
  <text x="60" y="150" class="L">1 · Add — opens ready to type</text>
  <text x="60" y="172" class="N">Keyboard up, button rides above it.</text>
  <g transform="translate(60 190)">
    <use href="#shell"/>
    <g filter="url(#sh)"><path d="M0 268 a28 28 0 0 1 28 -28 h344 a28 28 0 0 1 28 28 v732 h-400z" fill="#151c24" stroke="#26313c"/></g>
    <g transform="translate(0 252)"><use href="#grab"/></g>
    <text x="24" y="302" class="t1">Add item</text>
    <!-- list picker chip -->
    <rect x="24" y="314" width="132" height="26" rx="13" fill="#1b2631"/>
    <path d="M36 323h10M36 327h10M36 331h10" stroke="#4aa3ff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="54" y="332" class="t2" fill="#cfe0ee">to Home list ▾</text>
    <use href="#close" transform="translate(370 300)"/>
    <!-- big name placeholder -->
    <rect x="24" y="364" width="2" height="30" fill="#4aa3ff"/>
    <text x="32" y="388" class="bigph">What do you need?</text>
    <line x1="24" y1="408" x2="376" y2="408" stroke="#4aa3ff" stroke-width="2"/>
    <!-- recent quick picks -->
    <text x="24" y="436" class="lab">Recent</text>
    <rect x="24" y="446" width="76" height="30" rx="15" fill="#1b2631"/><text x="62" y="466" class="chip" font-size="12" text-anchor="middle">Milk</text>
    <rect x="106" y="446" width="76" height="30" rx="15" fill="#1b2631"/><text x="144" y="466" class="chip" font-size="12" text-anchor="middle">Bread</text>
    <rect x="188" y="446" width="76" height="30" rx="15" fill="#1b2631"/><text x="226" y="466" class="chip" font-size="12" text-anchor="middle">Eggs</text>
    <rect x="270" y="446" width="106" height="30" rx="15" fill="#1b2631"/><text x="323" y="466" class="chip" font-size="12" text-anchor="middle">Tomatoes</text>
    <!-- disabled button with reason -->
    <rect x="24" y="500" width="352" height="54" rx="18" fill="#1d3a57"/>
    <text x="200" y="533" class="btn" fill="#8fb4d6" text-anchor="middle">Type a name to add</text>
    <!-- keyboard -->
    <rect x="0" y="574" width="400" height="426" fill="#1a1f25"/>
    <g fill="#2a3139">
      <rect x="10" y="590" width="34" height="44" rx="6"/><rect x="49" y="590" width="34" height="44" rx="6"/><rect x="88" y="590" width="34" height="44" rx="6"/><rect x="127" y="590" width="34" height="44" rx="6"/><rect x="166" y="590" width="34" height="44" rx="6"/><rect x="205" y="590" width="34" height="44" rx="6"/><rect x="244" y="590" width="34" height="44" rx="6"/><rect x="283" y="590" width="34" height="44" rx="6"/><rect x="322" y="590" width="34" height="44" rx="6"/><rect x="361" y="590" width="30" height="44" rx="6"/>
      <rect x="28" y="644" width="34" height="44" rx="6"/><rect x="67" y="644" width="34" height="44" rx="6"/><rect x="106" y="644" width="34" height="44" rx="6"/><rect x="145" y="644" width="34" height="44" rx="6"/><rect x="184" y="644" width="34" height="44" rx="6"/><rect x="223" y="644" width="34" height="44" rx="6"/><rect x="262" y="644" width="34" height="44" rx="6"/><rect x="301" y="644" width="34" height="44" rx="6"/><rect x="340" y="644" width="34" height="44" rx="6"/>
      <rect x="10" y="698" width="52" height="44" rx="6"/><rect x="67" y="698" width="34" height="44" rx="6"/><rect x="106" y="698" width="34" height="44" rx="6"/><rect x="145" y="698" width="34" height="44" rx="6"/><rect x="184" y="698" width="34" height="44" rx="6"/><rect x="223" y="698" width="34" height="44" rx="6"/><rect x="262" y="698" width="34" height="44" rx="6"/><rect x="301" y="698" width="34" height="44" rx="6"/><rect x="340" y="698" width="50" height="44" rx="6"/>
      <rect x="10" y="752" width="80" height="44" rx="6"/><rect x="96" y="752" width="208" height="44" rx="6"/><rect x="310" y="752" width="80" height="44" rx="6" fill="#2e8ae6"/>
    </g>
    <text x="350" y="779" class="key" text-anchor="middle" fill="#fff">Add</text>
  </g>

  <!-- ========================================================== 2 FILLED -->
  <text x="500" y="150" class="L">2 · Add — smart defaults</text>
  <text x="500" y="172" class="N">Category guessed from history, unit + note optional.</text>
  <g transform="translate(500 190)">
    <use href="#shell"/>
    <g filter="url(#sh)"><path d="M0 268 a28 28 0 0 1 28 -28 h344 a28 28 0 0 1 28 28 v732 h-400z" fill="#151c24" stroke="#26313c"/></g>
    <g transform="translate(0 252)"><use href="#grab"/></g>
    <text x="24" y="302" class="t1">Add item</text>
    <rect x="24" y="314" width="132" height="26" rx="13" fill="#1b2631"/>
    <path d="M36 323h10M36 327h10M36 331h10" stroke="#4aa3ff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="54" y="332" class="t2" fill="#cfe0ee">to Home list ▾</text>
    <use href="#close" transform="translate(370 300)"/>
    <!-- name -->
    <text x="24" y="388" class="big">Milk</text>
    <line x1="24" y1="408" x2="376" y2="408" stroke="#4aa3ff" stroke-width="2"/>
    <!-- history hint -->
    <text x="24" y="430" class="t2">Last time: 2 L · Supermarket · bought 6 days ago</text>
    <!-- qty + unit + urgent -->
    <text x="24" y="466" class="lab">Quantity</text>
    <rect x="24" y="476" width="140" height="44" rx="22" fill="#1b2631"/>
    <circle cx="46" cy="498" r="16" fill="#243241"/><path d="M39 498h14" stroke="#dfe7ee" stroke-width="2.2" stroke-linecap="round"/>
    <text x="94" y="504" class="val" font-weight="700" text-anchor="middle" font-size="17">2</text>
    <circle cx="142" cy="498" r="16" fill="#2e8ae6"/><path d="M135 498h14M142 491v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="172" y="476" width="70" height="44" rx="22" fill="#1b2631"/><text x="207" y="503" class="chip" text-anchor="middle">L ▾</text>
    <rect x="250" y="476" width="126" height="44" rx="22" fill="none" stroke="#3a4856"/>
    <path d="M275 487l-7 12h7l-3 11 11-15h-7l3-8z" fill="#8ea2b4"/>
    <text x="290" y="503" class="chip" fill="#b8c6d2">Urgent</text>
    <!-- categories -->
    <text x="24" y="556" class="lab">Category</text>
    <rect x="80" y="544" width="74" height="18" rx="9" fill="#173451"/><text x="117" y="557" class="t2" fill="#8fc6f5" text-anchor="middle" font-size="10" font-weight="700">AUTO</text>
    <g transform="translate(24 568)"><use href="#cats"/></g>
    <!-- note expanded inline -->
    <rect x="24" y="626" width="352" height="46" rx="14" fill="#1b2631"/>
    <path d="M40 643h12M40 649h12M40 655h8" stroke="#6f8397" stroke-width="1.6" stroke-linecap="round"/>
    <text x="62" y="654" class="val" font-size="14">Almarai, full fat</text>
    <!-- primary + add another -->
    <rect x="24" y="702" width="352" height="56" rx="18" fill="url(#btn)"/>
    <text x="200" y="736" class="btn" text-anchor="middle">Add 2 L Milk</text>
    <text x="200" y="790" class="chip" fill="#4aa3ff" text-anchor="middle">Add &amp; keep adding</text>
    <text x="200" y="812" class="t2" text-anchor="middle">Saves and clears the sheet for the next item</text>
  </g>

  <!-- ========================================================== 3 PIN -->
  <text x="940" y="150" class="L">3 · Pin — same sheet, + Repeat</text>
  <text x="940" y="172" class="N">Interval chips match the app’s pin options.</text>
  <g transform="translate(940 190)">
    <use href="#shell"/>
    <g filter="url(#sh)"><path d="M0 268 a28 28 0 0 1 28 -28 h344 a28 28 0 0 1 28 28 v732 h-400z" fill="#151c24" stroke="#26313c"/></g>
    <g transform="translate(0 252)"><use href="#grab"/></g>
    <use href="#pin" transform="translate(24 284) scale(.8)" fill="#4aa3ff"/>
    <text x="48" y="302" class="t1">New pin</text>
    <text x="24" y="332" class="t2">Comes back to your list on a schedule</text>
    <use href="#close" transform="translate(370 300)"/>
    <text x="24" y="388" class="big">Milk</text>
    <line x1="24" y1="408" x2="376" y2="408" stroke="#4aa3ff" stroke-width="2"/>
    <!-- repeat -->
    <text x="24" y="446" class="lab">Repeat</text>
    <rect x="24" y="456" width="64" height="38" rx="19" fill="#1b2631"/><text x="56" y="480" class="chip" text-anchor="middle">Once</text>
    <rect x="94" y="456" width="64" height="38" rx="19" fill="#1b2631"/><text x="126" y="480" class="chip" text-anchor="middle">Daily</text>
    <rect x="164" y="456" width="74" height="38" rx="19" fill="#2e8ae6"/><text x="201" y="480" class="chipOn" text-anchor="middle">Weekly</text>
    <rect x="244" y="456" width="74" height="38" rx="19" fill="#1b2631"/><text x="281" y="480" class="chip" text-anchor="middle">2 weeks</text>
    <rect x="324" y="456" width="52" height="38" rx="19" fill="#1b2631"/><text x="350" y="480" class="chip" text-anchor="middle">Mo.</text>
    <text x="24" y="514" class="t2" fill="#8fc6f5">Next on your list: Thursday</text>
    <!-- qty -->
    <text x="24" y="550" class="lab">Quantity</text>
    <rect x="24" y="560" width="140" height="44" rx="22" fill="#1b2631"/>
    <circle cx="46" cy="582" r="16" fill="#243241"/><path d="M39 582h14" stroke="#dfe7ee" stroke-width="2.2" stroke-linecap="round"/>
    <text x="94" y="588" class="val" font-weight="700" text-anchor="middle" font-size="17">1</text>
    <circle cx="142" cy="582" r="16" fill="#2e8ae6"/><path d="M135 582h14M142 575v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="172" y="560" width="126" height="44" rx="22" fill="none" stroke="#3a4856"/>
    <path d="M197 571l-7 12h7l-3 11 11-15h-7l3-8z" fill="#8ea2b4"/><text x="212" y="587" class="chip" fill="#b8c6d2">Urgent</text>
    <text x="24" y="640" class="lab">Category</text>
    <g transform="translate(24 652)"><use href="#cats"/></g>
    <!-- add now switch -->
    <rect x="24" y="712" width="352" height="52" rx="16" fill="#1b2631"/>
    <text x="42" y="744" class="val">Also add it to the list now</text>
    <rect x="320" y="725" width="44" height="26" rx="13" fill="#2e8ae6"/><circle cx="351" cy="738" r="10" fill="#fff"/>
    <rect x="24" y="786" width="352" height="56" rx="18" fill="url(#btn)"/>
    <text x="200" y="820" class="btn" text-anchor="middle">Pin Milk · weekly</text>
  </g>

  <!-- ========================================================== 4 EDIT -->
  <text x="1380" y="150" class="L">4 · Edit — context + actions</text>
  <text x="1380" y="172" class="N">Who/when on top, delete tucked away, quick “Bought”.</text>
  <g transform="translate(1380 190)">
    <use href="#shell"/>
    <g filter="url(#sh)"><path d="M0 268 a28 28 0 0 1 28 -28 h344 a28 28 0 0 1 28 28 v732 h-400z" fill="#151c24" stroke="#26313c"/></g>
    <g transform="translate(0 252)"><use href="#grab"/></g>
    <text x="24" y="302" class="t1">Edit item</text>
    <text x="24" y="330" class="t2">Added by Sara · 2 h ago · Home list</text>
    <!-- trash + close -->
    <circle cx="330" cy="300" r="16" fill="#2a1d1f"/>
    <path d="M323 294h14M327 294v-3h6v3M325 297l1 11h8l1-11" stroke="#f07178" stroke-width="1.7" fill="none" stroke-linejoin="round"/>
    <use href="#close" transform="translate(370 300)"/>
    <text x="24" y="388" class="big">Milk</text>
    <line x1="24" y1="408" x2="376" y2="408" stroke="#3a4856" stroke-width="1.5"/>
    <text x="24" y="446" class="lab">Quantity</text>
    <rect x="24" y="456" width="140" height="44" rx="22" fill="#1b2631"/>
    <circle cx="46" cy="478" r="16" fill="#243241"/><path d="M39 478h14" stroke="#dfe7ee" stroke-width="2.2" stroke-linecap="round"/>
    <text x="94" y="484" class="val" font-weight="700" text-anchor="middle" font-size="17">3</text>
    <circle cx="142" cy="478" r="16" fill="#2e8ae6"/><path d="M135 478h14M142 471v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="172" y="456" width="70" height="44" rx="22" fill="#1b2631"/><text x="207" y="483" class="chip" text-anchor="middle">L ▾</text>
    <rect x="250" y="456" width="126" height="44" rx="22" fill="#2a1d1f" stroke="#e0646c"/>
    <path d="M275 467l-7 12h7l-3 11 11-15h-7l3-8z" fill="#f07178"/><text x="290" y="483" class="chip" fill="#f4a3a8">Urgent</text>
    <text x="24" y="536" class="lab">Category</text>
    <g transform="translate(24 548)"><use href="#cats"/></g>
    <rect x="24" y="606" width="352" height="46" rx="14" fill="#1b2631"/>
    <path d="M40 623h12M40 629h12M40 635h8" stroke="#6f8397" stroke-width="1.6" stroke-linecap="round"/>
    <text x="62" y="634" class="val" font-size="14">Almarai, full fat</text>
    <!-- changed indicator -->
    <circle cx="30" cy="676" r="4" fill="#f5b942"/><text x="42" y="681" class="t2" fill="#f5c76a">2 changes not saved</text>
    <!-- actions -->
    <rect x="24" y="702" width="228" height="56" rx="18" fill="url(#btn)"/>
    <text x="138" y="736" class="btn" text-anchor="middle">Save changes</text>
    <rect x="262" y="702" width="114" height="56" rx="18" fill="none" stroke="#3a7d55" stroke-width="1.5"/>
    <path d="M286 731l6 6 12-13" stroke="#5fd08a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="736" class="chip" fill="#8fe0ad" text-anchor="middle">Bought</text>
  </g>

  <!-- ========================================================== notes -->
  <rect x="60" y="1214" width="1720" height="2" fill="#151d26"/>
  <text x="60" y="1246" class="N" font-size="15">Enhancements over A: list picker in the header · empty state opens with keyboard + recent picks · disabled button explains itself · “Last time” hint and AUTO category from history · unit next to quantity ·</text>
  <text x="60" y="1270" class="N" font-size="15">“Add &amp; keep adding” for fast entry · Pin adds Repeat chips + “next on your list” + add-now · Edit shows who/when, unsaved-changes dot, delete icon, and a one-tap “Bought”.</text>
</svg>
