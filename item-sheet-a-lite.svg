<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1250" viewBox="0 0 1840 1250">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3d9bf0"/><stop offset="1" stop-color="#2479cf"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="-6" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <path id="pin" d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z"/>
    <style>
      text{font-family:system-ui,"Segoe UI",sans-serif}
      .H{font-size:34px;font-weight:700;fill:#f3f7fb}
      .T{font-size:17px;fill:#93a6b8}
      .L{font-size:20px;font-weight:700;fill:#e8eef4}
      .N{font-size:14px;fill:#9fb1c2}
      .t1{font-size:19px;font-weight:700;fill:#f2f6fa}
      .t2{font-size:12px;fill:#8ea2b4}
      .lab{font-size:12px;font-weight:600;fill:#7f93a5}
      .val{font-size:15px;fill:#e6edf3}
      .chip{font-size:13px;font-weight:600;fill:#cfdbe6}
      .chipOn{font-size:13px;font-weight:700;fill:#ffffff}
      .btn{font-size:16px;font-weight:700;fill:#ffffff}
      .big{font-size:26px;font-weight:700;fill:#f2f6fa}
      .bigph{font-size:26px;font-weight:600;fill:#4b5b6a}
      .link{font-size:14px;font-weight:600;fill:#4aa3ff}
    </style>

    <g id="shell">
      <rect width="400" height="980" rx="30" fill="#0a0f15" stroke="#2a333d" stroke-width="2"/>
      <rect x="18" y="38" width="240" height="18" rx="6" fill="#16202a"/>
      <rect x="18" y="80" width="364" height="48" rx="24" fill="#121b25"/>
      <rect x="18" y="140" width="364" height="48" rx="20" fill="#111820"/>
      <rect width="400" height="980" rx="30" fill="#000" opacity=".55"/>
    </g>
    <g id="sheet">
      <g filter="url(#sh)"><path d="M0 348 a28 28 0 0 1 28 -28 h344 a28 28 0 0 1 28 28 v632 h-400z" fill="#151c24" stroke="#26313c"/></g>
      <rect x="178" y="332" width="44" height="5" rx="2.5" fill="#5b6b7a"/>
    </g>
    <g id="close">
      <circle r="15" fill="#1d2731"/><path d="M-5.5 -5.5l11 11M5.5 -5.5l-11 11" stroke="#9fb1c2" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- qty stepper -->
    <g id="stepper">
      <rect width="132" height="42" rx="21" fill="#1b2631"/>
      <circle cx="21" cy="21" r="15" fill="#243241"/><path d="M15 21h12" stroke="#dfe7ee" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="111" cy="21" r="15" fill="#2e8ae6"/><path d="M105 21h12M111 15v12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="unit">
      <rect width="62" height="42" rx="21" fill="#1b2631"/>
      <path d="M44 18l4 4 4-4" stroke="#8ea2b4" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
    <g id="urgentOff">
      <rect width="108" height="42" rx="21" fill="none" stroke="#33414f"/>
      <path d="M24 11l-7 11h7l-3 10 10-14h-7l3-7z" fill="#7f93a5"/>
      <text x="40" y="26" class="chip" fill="#a9b8c5">Urgent</text>
    </g>
    <g id="urgentOn">
      <rect width="108" height="42" rx="21" fill="#2a1d1f" stroke="#e0646c"/>
      <path d="M24 11l-7 11h7l-3 10 10-14h-7l3-7z" fill="#f07178"/>
      <text x="40" y="26" class="chip" fill="#f4a3a8">Urgent</text>
    </g>
    <g id="cats">
      <rect width="124" height="36" rx="18" fill="#2e8ae6"/><text x="62" y="23" class="chipOn" text-anchor="middle">Supermarket</text>
      <rect x="132" width="106" height="36" rx="18" fill="#1b2631"/><text x="185" y="23" class="chip" text-anchor="middle">Vegetables</text>
      <rect x="246" width="64" height="36" rx="18" fill="#1b2631"/><text x="278" y="23" class="chip" text-anchor="middle">Meat</text>
      <rect x="318" width="34" height="36" rx="18" fill="#1b2631"/><text x="335" y="23" class="chip" text-anchor="middle">⋯</text>
    </g>
  </defs>

  <rect width="1840" height="1250" fill="#070b10"/>
  <text x="60" y="64" class="H">Focus-first item sheet — lite</text>
  <text x="60" y="96" class="T">Only what’s needed: name, quantity + unit + urgent, category, note on demand, one button.</text>

  <!-- ================= 1 Add empty -->
  <text x="60" y="150" class="L">1 · Add</text>
  <g transform="translate(60 180)">
    <use href="#shell"/><use href="#sheet"/>
    <text x="24" y="384" class="t1">Add item</text>
    <use href="#close" transform="translate(372 378)"/>
    <rect x="24" y="420" width="2" height="30" fill="#4aa3ff"/>
    <text x="32" y="444" class="bigph">What do you need?</text>
    <line x1="24" y1="466" x2="376" y2="466" stroke="#4aa3ff" stroke-width="2"/>
    <text x="24" y="500" class="lab">Recent</text>
    <rect x="24" y="512" width="64" height="30" rx="15" fill="#1b2631"/><text x="56" y="532" class="chip" font-size="12" text-anchor="middle">Milk</text>
    <rect x="96" y="512" width="68" height="30" rx="15" fill="#1b2631"/><text x="130" y="532" class="chip" font-size="12" text-anchor="middle">Bread</text>
    <rect x="172" y="512" width="64" height="30" rx="15" fill="#1b2631"/><text x="204" y="532" class="chip" font-size="12" text-anchor="middle">Eggs</text>
    
    <rect x="24" y="880" width="352" height="54" rx="18" fill="#1d3a57"/>
    <text x="200" y="913" class="btn" fill="#8fb4d6" text-anchor="middle">Type a name to add</text>
  </g>

  <!-- ================= 2 Add filled -->
  <text x="500" y="150" class="L">2 · Add — choosing a unit</text>
  <g transform="translate(500 180)">
    <use href="#shell"/><use href="#sheet"/>
    <text x="24" y="384" class="t1">Add item</text>
    <use href="#close" transform="translate(372 378)"/>
    <text x="24" y="444" class="big">Milk</text>
    <line x1="24" y1="466" x2="376" y2="466" stroke="#4aa3ff" stroke-width="2"/>
    <g transform="translate(24 500)"><use href="#stepper"/></g>
    <text x="90" y="527" class="val" font-weight="700" font-size="17" text-anchor="middle">2</text>
    <g transform="translate(164 500)"><rect width="62" height="42" rx="21" fill="#173451" stroke="#4aa3ff"/><text x="24" y="27" class="chipOn" text-anchor="middle">L</text><path d="M40 23l4 -4 4 4" stroke="#8fc6f5" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(236 500)"><use href="#urgentOff"/></g>
    <!-- unit picker (open) -->
    <rect x="24" y="552" width="352" height="48" rx="16" fill="#111922" stroke="#26313c"/>
    <rect x="32" y="560" width="46" height="32" rx="16" fill="#1b2631"/><text x="55" y="581" class="chip" text-anchor="middle">pcs</text>
    <rect x="84" y="560" width="42" height="32" rx="16" fill="#1b2631"/><text x="105" y="581" class="chip" text-anchor="middle">kg</text>
    <rect x="132" y="560" width="38" height="32" rx="16" fill="#1b2631"/><text x="151" y="581" class="chip" text-anchor="middle">g</text>
    <rect x="176" y="560" width="38" height="32" rx="16" fill="#2e8ae6"/><text x="195" y="581" class="chipOn" text-anchor="middle">L</text>
    <rect x="220" y="560" width="44" height="32" rx="16" fill="#1b2631"/><text x="242" y="581" class="chip" text-anchor="middle">ml</text>
    <rect x="270" y="560" width="56" height="32" rx="16" fill="#1b2631"/><text x="298" y="581" class="chip" text-anchor="middle">pack</text>
    <rect x="332" y="560" width="36" height="32" rx="16" fill="#1b2631"/><text x="350" y="581" class="chip" text-anchor="middle">⋯</text>
    <text x="24" y="634" class="lab">Category</text>
    <g transform="translate(24 646)"><use href="#cats"/></g>
    <path d="M26 726h10M31 721v10" stroke="#4aa3ff" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="731" class="link">Add note</text>
    <rect x="24" y="880" width="352" height="54" rx="18" fill="url(#btn)"/>
    <text x="200" y="913" class="btn" text-anchor="middle">Add 2 L Milk</text>
  </g>

  <!-- ================= 3 Pin -->
  <text x="940" y="150" class="L">3 · Pin</text>
  <g transform="translate(940 180)">
    <use href="#shell"/><use href="#sheet"/>
    <use href="#pin" transform="translate(24 366) scale(.8)" fill="#4aa3ff"/>
    <text x="48" y="384" class="t1">New pin</text>
    <use href="#close" transform="translate(372 378)"/>
    <text x="24" y="444" class="big">Milk</text>
    <line x1="24" y1="466" x2="376" y2="466" stroke="#4aa3ff" stroke-width="2"/>
    <text x="24" y="504" class="lab">Repeat</text>
    <rect x="24" y="516" width="70" height="36" rx="18" fill="#1b2631"/><text x="59" y="539" class="chip" text-anchor="middle">Daily</text>
    <rect x="102" y="516" width="80" height="36" rx="18" fill="#2e8ae6"/><text x="142" y="539" class="chipOn" text-anchor="middle">Weekly</text>
    <rect x="190" y="516" width="84" height="36" rx="18" fill="#1b2631"/><text x="232" y="539" class="chip" text-anchor="middle">2 weeks</text>
    <rect x="282" y="516" width="82" height="36" rx="18" fill="#1b2631"/><text x="323" y="539" class="chip" text-anchor="middle">Monthly</text>
    <g transform="translate(24 578)"><use href="#stepper"/></g>
    <text x="90" y="605" class="val" font-weight="700" font-size="17" text-anchor="middle">1</text>
    <g transform="translate(164 578)"><use href="#unit"/><text x="22" y="27" class="chip" text-anchor="middle">L</text></g>
    <g transform="translate(236 578)"><use href="#urgentOff"/></g>
    <text x="24" y="660" class="lab">Category</text>
    <g transform="translate(24 672)"><use href="#cats"/></g>
    <rect x="24" y="880" width="352" height="54" rx="18" fill="url(#btn)"/>
    <text x="200" y="913" class="btn" text-anchor="middle">Pin 1 L Milk · weekly</text>
  </g>

  <!-- ================= 4 Edit -->
  <text x="1380" y="150" class="L">4 · Edit</text>
  <g transform="translate(1380 180)">
    <use href="#shell"/><use href="#sheet"/>
    <text x="24" y="384" class="t1">Edit item</text>
    <circle cx="330" cy="378" r="15" fill="#2a1d1f"/>
    <path d="M323.5 372h13M327.5 372v-3h5v3M325.5 375l1 10h7l1-10" stroke="#f07178" stroke-width="1.7" fill="none" stroke-linejoin="round"/>
    <use href="#close" transform="translate(372 378)"/>
    <text x="24" y="444" class="big">Milk</text>
    <line x1="24" y1="466" x2="376" y2="466" stroke="#3a4856" stroke-width="1.5"/>
    <g transform="translate(24 500)"><use href="#stepper"/></g>
    <text x="90" y="527" class="val" font-weight="700" font-size="17" text-anchor="middle">3</text>
    <g transform="translate(164 500)"><use href="#unit"/><text x="22" y="27" class="chip" text-anchor="middle">L</text></g>
    <g transform="translate(236 500)"><use href="#urgentOn"/></g>
    <text x="24" y="584" class="lab">Category</text>
    <g transform="translate(24 596)"><use href="#cats"/></g>
    <rect x="24" y="660" width="352" height="44" rx="14" fill="#1b2631"/>
    <text x="40" y="688" class="val" font-size="14">Almarai, full fat</text>
    <rect x="24" y="880" width="352" height="54" rx="18" fill="url(#btn)"/>
    <text x="200" y="913" class="btn" text-anchor="middle">Save changes</text>
  </g>

  <rect x="60" y="1180" width="1720" height="2" fill="#151d26"/>
  <text x="60" y="1214" class="N" font-size="15">Per sheet: big name · one row for quantity, unit + urgent (tap the unit for pcs · kg · g · L · ml · pack · ⋯ custom) · category chips (⋯ for the rest) · note only when asked for · one button at the bottom that names the action.</text>
  <text x="60" y="1236" class="N" font-size="15">Cancel = swipe down or ✕. Recent picks appear only while the name is empty. Delete lives in the Edit header.</text>
</svg>
