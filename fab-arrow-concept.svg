<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="fab" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a8fdc"/><stop offset="1" stop-color="#1f5f9c"/></linearGradient>
    <filter id="sh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".6"/></filter>
    <path id="pin" d="M16,12V4H17V2H7V4H8V12L6,14V16H11.2V22H12.8V16H18V14L16,12Z"/>
    <path id="cart" d="M17,18C15.89,18 15,18.89 15,20A2,2 0 0,0 17,22A2,2 0 0,0 19,20C19,18.89 18.1,18 17,18M1,2V4H3L6.6,11.59L5.24,14.04C5.09,14.32 5,14.65 5,15A2,2 0 0,0 7,17H19V15H7.42A0.25,0.25 0 0,1 7.17,14.75C7.17,14.7 7.18,14.66 7.2,14.630L8.1,13H15.55C16.3,13 16.96,12.58 17.3,11.97L20.88,5.5C20.95,5.34 21,5.17 21,5A1,1 0 0,0 20,4H5.21L4.27,2M7,18C5.89,18 5,18.89 5,20A2,2 0 0,0 7,22A2,2 0 0,0 9,20C9,18.89 8.1,18 7,18Z"/>
    <style>
      text{font-family:system-ui,"Segoe UI",sans-serif}
      .H{font-size:34px;font-weight:700;fill:#f3f7fb}
      .T{font-size:17px;fill:#93a6b8}
      .L{font-size:18px;font-weight:650;fill:#e8eef4}
      .N{font-size:14px;fill:#9fb1c2}
      .title{font-size:18px;font-weight:700;fill:#f2f6fa}
      .sub{font-size:10px;fill:#c9d4de}
      .ink{font-size:12px;fill:#dfe7ee}
      .mut{font-size:10px;fill:#7f91a3}
      .tab{font-size:9px;font-weight:600;fill:#8a9bab}
      .chip{font-size:11px;font-weight:600;fill:#e6edf3}
    </style>

    <!-- shared phone body (352 x 730) -->
    <g id="phone">
      <rect width="352" height="730" rx="30" fill="#0a0f15" stroke="#2a333d" stroke-width="2"/>
      <!-- header -->
      <circle cx="44" cy="40" r="20" fill="#1a222c" stroke="#3a4552"/>
      <rect x="35" y="31" width="4" height="4" rx="1" fill="#4aa3ff"/><rect x="42" y="32" width="12" height="2.5" rx="1" fill="#dfe7ee"/>
      <rect x="35" y="39" width="4" height="4" rx="1" fill="#4aa3ff"/><rect x="42" y="40" width="12" height="2.5" rx="1" fill="#dfe7ee"/>
      <circle cx="37" cy="49" r="3" fill="none" stroke="#e0a64a" stroke-width="1.5"/>
      <text x="74" y="40" class="title">My Home</text>
      <text x="74" y="56" class="sub">3 still to get · List</text>
      <text x="296" y="39" class="ink" font-weight="600">List</text>
      <polyline points="322,33 326,37 330,33" fill="none" stroke="#dfe7ee" stroke-width="1.6" stroke-linecap="round"/>
      <!-- quick add bar: input + single round add -->
      <rect x="24" y="100" width="304" height="52" rx="16" fill="#111922" stroke="#2c3946"/>
      <text x="38" y="131" class="ink" fill="#c9d4de">Bread</text>
      <rect x="71" y="119" width="1.4" height="16" fill="#4aa3ff"/>
      <circle cx="304" cy="126" r="17" fill="#1f4f7a" stroke="#3b74a8"/>
      <path d="M304 119v14M297 126h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <!-- category chip only -->
      <rect x="24" y="162" width="70" height="28" rx="10" fill="#111922" stroke="#2c3946"/>
      <text x="38" y="180" class="chip">All</text>
      <polyline points="62,174 66,178 70,174" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-linecap="round"/>
      <text x="104" y="180" class="mut">category for new items</text>
      <!-- items -->
      <g>
        <rect x="24" y="204" width="304" height="52" rx="14" fill="#111820" stroke="#1d2731"/>
        <circle cx="48" cy="230" r="9" fill="none" stroke="#4d6175" stroke-width="1.6"/>
        <text x="66" y="227" class="ink" font-weight="600">Milk</text><text x="66" y="242" class="mut">Dairy · added by Sara</text>
        <rect x="24" y="262" width="304" height="52" rx="14" fill="#111820" stroke="#1d2731"/>
        <circle cx="48" cy="288" r="9" fill="none" stroke="#4d6175" stroke-width="1.6"/>
        <text x="66" y="285" class="ink" font-weight="600">Eggs</text><text x="66" y="300" class="mut">Dairy · pinned weekly</text>
        <use href="#pin" transform="translate(304 280) scale(.62)" fill="#6f8397"/>
        <rect x="24" y="320" width="304" height="52" rx="14" fill="#111820" stroke="#1d2731"/>
        <circle cx="48" cy="346" r="9" fill="none" stroke="#4d6175" stroke-width="1.6"/>
        <text x="66" y="343" class="ink" font-weight="600">Tomatoes</text><text x="66" y="358" class="mut">Produce · 1 kg</text>
      </g>
      <!-- tab bar -->
      <rect x="26" y="656" width="300" height="52" rx="26" fill="#111922" stroke="#2c3946"/>
      <rect x="36" y="661" width="58" height="42" rx="21" fill="#173451" stroke="#25507a"/>
      <path d="M58 672h14M58 677h14M58 682h14" stroke="#4aa3ff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="65" y="697" class="tab" fill="#4aa3ff" text-anchor="middle">Items</text>
      <circle cx="139" cy="677" r="6.5" fill="none" stroke="#8a9bab" stroke-width="1.5"/><path d="M139 673v4l3 2" stroke="#8a9bab" stroke-width="1.4" fill="none"/>
      <text x="139" y="697" class="tab" text-anchor="middle">History</text>
      <path d="M206 680v-5l7-6 7 6v5z" fill="none" stroke="#8a9bab" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="213" y="697" class="tab" text-anchor="middle">Home</text>
      <circle cx="288" cy="677" r="6" fill="none" stroke="#8a9bab" stroke-width="1.5" stroke-dasharray="3 1.6"/><circle cx="288" cy="677" r="2.2" fill="none" stroke="#8a9bab" stroke-width="1.3"/>
      <text x="288" y="697" class="tab" text-anchor="middle">Settings</text>
    </g>

    <!-- main FAB + arrow -->
    <g id="fabMain" filter="url(#sh)">
      <circle cx="298" cy="610" r="27" fill="url(#fab)" stroke="#5aa6ea" stroke-width="1"/>
      <path d="M298 600v20M288 610h20" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="1120" fill="#070b10"/>
  <text x="70" y="70" class="H">Quick-add bar + floating Add with a reveal arrow</text>
  <text x="70" y="102" class="T">The bar keeps only its round + (same quick-add behaviour). Pinned and Shop move into a small arrow above the floating Add button.</text>

  <!-- ============ PHONE 1: collapsed ============ -->
  <text x="70" y="160" class="L">1 · Collapsed (default)</text>
  <g transform="translate(70 180) scale(1.18)">
    <use href="#phone"/>
    <!-- arrow chip -->
    <g filter="url(#sh)">
      <circle cx="298" cy="565" r="14" fill="#141e29" stroke="#35506b" stroke-width="1.2"/>
      <polyline points="292,568 298,562 304,568" fill="none" stroke="#8fc6f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <use href="#fabMain"/>
  </g>

  <!-- ============ PHONE 2: expanded ============ -->
  <text x="560" y="160" class="L">2 · Arrow tapped (expanded)</text>
  <g transform="translate(560 180) scale(1.18)">
    <use href="#phone"/>
    <!-- scrim -->
    <rect x="1" y="1" width="350" height="728" rx="29" fill="#03060a" opacity=".62"/>
    <!-- Shop -->
    <g filter="url(#sh)">
      <rect x="196" y="455" width="74" height="30" rx="15" fill="#16212d" stroke="#2f4357"/>
      <text x="212" y="474" class="chip">Shop</text>
      <circle cx="298" cy="470" r="21" fill="#1a2a3a" stroke="#3b74a8" stroke-width="1.2"/>
      <use href="#cart" transform="translate(288 460) scale(.84)" fill="#8fc6f5"/>
      <circle cx="313" cy="455" r="8" fill="#e0a64a"/><text x="313" y="459" font-size="10" font-weight="700" fill="#1a1205" text-anchor="middle">3</text>
    </g>
    <!-- Pinned -->
    <g filter="url(#sh)">
      <rect x="186" y="503" width="84" height="30" rx="15" fill="#16212d" stroke="#2f4357"/>
      <text x="201" y="522" class="chip">Pinned</text>
      <circle cx="298" cy="518" r="21" fill="#1a2a3a" stroke="#3b74a8" stroke-width="1.2"/>
      <use href="#pin" transform="translate(288 508) scale(.84)" fill="#8fc6f5"/>
    </g>
    <!-- arrow flipped -->
    <g filter="url(#sh)">
      <circle cx="298" cy="565" r="14" fill="#1f4f7a" stroke="#4a8cc8" stroke-width="1.2"/>
      <polyline points="292,562 298,568 304,562" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <use href="#fabMain"/>
  </g>

  <!-- ============ RIGHT: bar before/after + notes ============ -->
  <g transform="translate(1050 150)">
    <text x="0" y="10" class="L">Input bar — before → after</text>

    <text x="0" y="52" class="N">Before</text>
    <rect x="0" y="64" width="470" height="70" rx="18" fill="#111922" stroke="#2c3946"/>
    <text x="22" y="105" font-size="16" fill="#c9d4de">Bread</text>
    <path d="M326 90h16M326 97h16M326 104h12" stroke="#4aa3ff" stroke-width="2" stroke-linecap="round"/><circle cx="344" cy="106" r="6" fill="#4aa3ff"/>
    <rect x="370" y="76" width="88" height="46" rx="14" fill="#1f4f7a"/>
    <text x="388" y="106" font-size="16" font-weight="600" fill="#fff">+ Add</text>
    <rect x="0" y="146" width="104" height="38" rx="12" fill="#111922" stroke="#2c3946"/><text x="30" y="170" class="chip" font-size="14">All ⌄</text>
    <rect x="114" y="146" width="168" height="38" rx="12" fill="#111922" stroke="#2c3946"/><use href="#pin" transform="translate(162 156) scale(.75)" fill="#dfe7ee"/><text x="186" y="170" class="chip" font-size="14">Pinned</text>
    <rect x="292" y="146" width="178" height="38" rx="12" fill="#0d141b" stroke="#1f2a35"/><use href="#cart" transform="translate(340 156) scale(.75)" fill="#2c5f8f"/><text x="364" y="170" font-size="14" font-weight="600" fill="#2c5f8f">Shop · 0</text>

    <path d="M235 202v26" stroke="#4aa3ff" stroke-width="2"/><polyline points="227,220 235,228 243,220" fill="none" stroke="#4aa3ff" stroke-width="2"/>

    <text x="0" y="262" class="N">After</text>
    <rect x="0" y="274" width="470" height="70" rx="18" fill="#111922" stroke="#2c3946"/>
    <text x="22" y="315" font-size="16" fill="#c9d4de">Bread</text>
    <circle cx="430" cy="309" r="24" fill="#1f4f7a" stroke="#3b74a8"/>
    <path d="M430 299v20M420 309h20" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="0" y="356" width="88" height="34" rx="12" fill="#111922" stroke="#2c3946"/><text x="26" y="378" class="chip" font-size="14">All ⌄</text>

    <line x1="0" y1="430" x2="470" y2="430" stroke="#1d2731"/>
    <text x="0" y="470" class="L">Behaviour</text>
    <g class="N">
      <circle cx="8" cy="500" r="11" fill="#1f4f7a"/><path d="M8 494v12M2 500h12" stroke="#fff" stroke-width="1.8"/>
      <text x="30" y="505" class="N">Round + in the bar → quick add the typed name</text>
      <text x="30" y="525" class="N">(same as today’s “Add”, also on keyboard submit).</text>

      <circle cx="8" cy="560" r="11" fill="url(#fab)"/><path d="M8 554v12M2 560h12" stroke="#fff" stroke-width="1.8"/>
      <text x="30" y="565" class="N">Floating + → opens “Add with details”</text>
      <text x="30" y="585" class="N">(replaces the list icon that was inside the bar).</text>

      <circle cx="8" cy="620" r="11" fill="#141e29" stroke="#35506b"/><polyline points="3,623 8,618 13,623" fill="none" stroke="#8fc6f5" stroke-width="1.8"/>
      <text x="30" y="625" class="N">Arrow → reveals Pinned and Shop, flips to ⌄.</text>
      <text x="30" y="645" class="N">Tap the arrow, the scrim, or an action to close.</text>

      <circle cx="8" cy="680" r="11" fill="#1a2a3a" stroke="#3b74a8"/><use href="#cart" transform="translate(1 673) scale(.58)" fill="#8fc6f5"/>
      <text x="30" y="685" class="N">Shop shows a count badge; when the list is empty</text>
      <text x="30" y="705" class="N">or a partner is shopping it stays visible but dimmed.</text>

      <circle cx="8" cy="740" r="11" fill="#1a2a3a" stroke="#3b74a8"/><use href="#pin" transform="translate(1 733) scale(.58)" fill="#8fc6f5"/>
      <text x="30" y="745" class="N">Pinned → opens the pins screen, as today.</text>
    </g>
    <text x="0" y="800" class="mut" style="font-size:14px">The FAB sits above the tab bar, on the trailing edge (flips to the left in RTL).</text>
  </g>
</svg>
