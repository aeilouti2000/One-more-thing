plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.onemorething.receiptocr'
version = '1.0.0'

android {
  namespace "expo.modules.receiptocr"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.android.gms:play-services-mlkit-text-recognition-arabic:16.0.1"
}
