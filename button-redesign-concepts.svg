<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#2189dc"/><stop offset="1" stop-color="#1462a1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 26px system-ui,sans-serif;fill:#f4f8fc}.sub{font:400 16px system-ui,sans-serif;fill:#96a9b9}.card{fill:#10161c;stroke:#2c3b48;stroke-width:1.5}.label{font:600 18px system-ui,sans-serif;fill:#f2f7fb}.small{font:500 14px system-ui,sans-serif;fill:#b5c7d6}.muted{font:500 14px system-ui,sans-serif;fill:#91a4b3}.btn{fill:#151e26;stroke:#334553;stroke-width:1.5}.accent{fill:url(#blue)}.accenttext{font:650 15px system-ui,sans-serif;fill:#fff}.badge{fill:#153d60}.blueText{font:600 14px system-ui,sans-serif;fill:#4caeff}.line{stroke:#263541;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#080c10"/>
  <text x="72" y="76" class="title" font-size="38">Shopping controls — redesign directions</text>
  <text x="72" y="110" class="sub">The current four buttons are “Add”, “All”, “Pinned”, and “Shop · 0”. These concepts improve hierarchy, scanability, and touch targets.</text>

  <!-- A -->
  <g transform="translate(72 164)" filter="url(#shadow)">
    <rect class="card" width="704" height="398" rx="24"/>
    <text x="34" y="48" class="label">A. Primary action + filter chips</text>
    <text x="34" y="76" class="sub">Best default: the add task is visually dominant; filters become compact chips.</text>
    <rect x="32" y="110" width="640" height="68" rx="16" fill="#0d1319" stroke="#334553" stroke-width="1.5"/>
    <text x="56" y="151" class="muted">Add an item…</text>
    <circle cx="460" cy="144" r="18" fill="#173b58"/><text x="450" y="150" class="blueText">☷</text>
    <rect x="510" y="120" width="142" height="48" rx="14" class="accent"/>
    <text x="535" y="150" class="accenttext">＋ Add item</text>
    <text x="34" y="215" class="small">View</text>
    <rect x="32" y="230" width="92" height="52" rx="26" class="accent"/><text x="58" y="262" class="accenttext">All</text>
    <rect x="136" y="230" width="122" height="52" rx="26" class="btn"/><text x="164" y="262" class="small">★ Pinned</text>
    <rect x="270" y="230" width="118" height="52" rx="26" class="btn"/><text x="298" y="262" class="small">⌕ Search</text>
    <rect x="32" y="319" width="640" height="46" rx="12" fill="#0c1217"/>
    <text x="52" y="348" class="muted">Shop status</text><rect x="560" y="330" width="92" height="24" rx="12" class="badge"/><text x="579" y="347" class="blueText">Cart · 0</text>
  </g>

  <!-- B -->
  <g transform="translate(824 164)" filter="url(#shadow)">
    <rect class="card" width="704" height="398" rx="24"/>
    <text x="34" y="48" class="label">B. Segmented view switcher</text>
    <text x="34" y="76" class="sub">A calmer, structured option when “All” and “Pinned” are the core modes.</text>
    <rect x="32" y="110" width="500" height="68" rx="16" fill="#0d1319" stroke="#334553" stroke-width="1.5"/>
    <text x="56" y="151" class="muted">Add an item…</text>
    <rect x="546" y="110" width="126" height="68" rx="16" class="accent"/><text x="570" y="152" class="accenttext">＋ Add</text>
    <rect x="32" y="214" width="350" height="58" rx="15" fill="#0b1015" stroke="#334553" stroke-width="1.5"/>
    <rect x="35" y="217" width="170" height="52" rx="12" class="accent"/><text x="102" y="250" class="accenttext">All</text>
    <text x="250" y="250" class="small">★ Pinned</text>
    <rect x="402" y="214" width="270" height="58" rx="15" class="btn"/>
    <text x="430" y="250" class="small">🛒 Shopping</text><rect x="610" y="229" width="38" height="28" rx="14" class="badge"/><text x="622" y="249" class="blueText">0</text>
    <line x1="32" y1="320" x2="672" y2="320" class="line"/>
    <text x="32" y="356" class="muted">Clear mode hierarchy, with cart count always visible.</text>
  </g>

  <!-- C -->
  <g transform="translate(72 612)" filter="url(#shadow)">
    <rect class="card" width="704" height="398" rx="24"/>
    <text x="34" y="48" class="label">C. Toolbar pattern</text>
    <text x="34" y="76" class="sub">Best when power features will grow: filters, sort, search, or multi-select.</text>
    <rect x="32" y="110" width="640" height="70" rx="16" fill="#0d1319" stroke="#334553" stroke-width="1.5"/>
    <text x="56" y="152" class="muted">Add an item…</text>
    <rect x="574" y="122" width="82" height="46" rx="13" class="accent"/><text x="591" y="151" class="accenttext">Add</text>
    <rect x="32" y="207" width="640" height="64" rx="16" fill="#0c1217" stroke="#263541"/>
    <text x="56" y="246" class="small">≡ All items</text>
    <line x1="202" y1="221" x2="202" y2="257" class="line"/>
    <text x="230" y="246" class="small">★ Pinned</text>
    <line x1="380" y1="221" x2="380" y2="257" class="line"/>
    <text x="408" y="246" class="blueText">🛒 Cart</text>
    <rect x="570" y="226" width="72" height="28" rx="14" class="badge"/><text x="593" y="246" class="blueText">0 items</text>
    <text x="32" y="337" class="muted">A single, dependable action bar—strong for a feature-rich list.</text>
  </g>

  <!-- callout -->
  <g transform="translate(824 612)">
    <rect width="704" height="398" rx="24" fill="#0e1820" stroke="#245071" stroke-width="1.5"/>
    <text x="36" y="55" class="label">Recommendation</text>
    <text x="36" y="90" class="sub">Choose direction A for this screen.</text>
    <rect x="36" y="124" width="632" height="1" fill="#264052"/>
    <text x="36" y="170" class="label">Why it works</text>
    <text x="36" y="205" class="small">• “Add item” is one obvious primary action.</text>
    <text x="36" y="238" class="small">• Selected state is unmistakable—not just a small caret.</text>
    <text x="36" y="271" class="small">• Cart becomes status, rather than competing as a third button.</text>
    <text x="36" y="304" class="small">• 48–52 px controls are friendlier for thumbs.</text>
    <rect x="36" y="332" width="632" height="38" rx="10" fill="#112331"/>
    <text x="55" y="357" class="blueText">Keep blue for actions and active states only; use neutral surfaces for filters.</text>
  </g>
</svg>
